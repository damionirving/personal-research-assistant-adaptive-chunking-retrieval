name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

env:
  AWS_ACCOUNT_ID: ${{ vars.AWS_ACCOUNT_ID }}
  AWS_REGION: ${{ vars.AWS_REGION }}
  AWS_DEPLOY_ROLE_NAME: ${{ vars.AWS_DEPLOY_ROLE_NAME }}

jobs:
  deploy:
    name: Deploy CDK stack
    runs-on: ubuntu-latest
    environment: production
    if: >-
      github.repository == 'damionirving/personal-research-assistant-adaptive-chunking-retrieval' &&
      github.ref == 'refs/heads/main'

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install AWS CDK
        run: npm install --global aws-cdk@latest

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install ".[dev]"
          python -m pip install -r infra/requirements.txt

      - name: Run tests
        run: python -m pytest

      - name: Validate deployment variables
        id: deployment
        shell: bash
        env:
          PRA_COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          PRA_COGNITO_CALLBACK_LOGOUT_URL: ${{ vars.COGNITO_CALLBACK_LOGOUT_URL }}
          PRA_WEBSITE_DOMAIN: ${{ vars.WEBSITE_DOMAIN }}
          COST_ALERT_EMAIL: ${{ vars.COST_ALERT_EMAIL }}
        run: |
          set -euo pipefail
          PYTHONPATH=infra python -c 'import os; from pra_infra.email_validation import validate_owner_email; validate_owner_email(os.environ.get("COST_ALERT_EMAIL"))' || { echo 'Set COST_ALERT_EMAIL to a valid non-placeholder email address.'; exit 1; }
          [[ "$AWS_ACCOUNT_ID" =~ ^[0-9]{12}$ && "$AWS_ACCOUNT_ID" != 000000000000 ]]
          [[ "$AWS_REGION" =~ ^[a-z]{2}(-[a-z0-9]+)+-[0-9]+$ ]]
          [[ "$AWS_DEPLOY_ROLE_NAME" =~ ^[A-Za-z0-9+=,.@_-]{1,64}$ ]]
          [[ "$PRA_COGNITO_USER_POOL_ID" =~ ^[a-z0-9-]+_[A-Za-z0-9]+$ ]]
          [[ "$PRA_COGNITO_CALLBACK_LOGOUT_URL" == https://* ]]
          [[ "$PRA_WEBSITE_DOMAIN" =~ ^[A-Za-z0-9.-]+$ && "$PRA_WEBSITE_DOMAIN" == *.* ]]
          case "$AWS_REGION" in cn-*) partition=aws-cn ;; us-gov-*) partition=aws-us-gov ;; *) partition=aws ;; esac
          echo "role_arn=arn:${partition}:iam::${AWS_ACCOUNT_ID}:role/${AWS_DEPLOY_ROLE_NAME}" >> "$GITHUB_OUTPUT"

      - name: Validate production deployment context
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REPOSITORY}" = "damionirving/personal-research-assistant-adaptive-chunking-retrieval"
          test "${GITHUB_REF}" = "refs/heads/main"
          case "${GITHUB_EVENT_NAME}" in
            push|workflow_dispatch) ;;
            *) echo "Unsupported deployment event: ${GITHUB_EVENT_NAME}" && exit 1 ;;
          esac

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ steps.deployment.outputs.role_arn }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-production-${{ github.run_id }}

      - name: CDK synth
        working-directory: infra
        env:
          PRA_COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          PRA_COGNITO_CALLBACK_LOGOUT_URL: ${{ vars.COGNITO_CALLBACK_LOGOUT_URL }}
          PRA_WEBSITE_DOMAIN: ${{ vars.WEBSITE_DOMAIN }}
          COST_ALERT_EMAIL: ${{ vars.COST_ALERT_EMAIL }}
        run: cdk synth -c account=${{ env.AWS_ACCOUNT_ID }} -c region=${{ env.AWS_REGION }} -c owner_email="$COST_ALERT_EMAIL"

      - name: CDK deploy
        working-directory: infra
        env:
          PRA_COGNITO_USER_POOL_ID: ${{ vars.COGNITO_USER_POOL_ID }}
          PRA_COGNITO_CALLBACK_LOGOUT_URL: ${{ vars.COGNITO_CALLBACK_LOGOUT_URL }}
          PRA_WEBSITE_DOMAIN: ${{ vars.WEBSITE_DOMAIN }}
          COST_ALERT_EMAIL: ${{ vars.COST_ALERT_EMAIL }}
        run: cdk deploy --require-approval never --force -c account=${{ env.AWS_ACCOUNT_ID }} -c region=${{ env.AWS_REGION }} -c owner_email="$COST_ALERT_EMAIL"
