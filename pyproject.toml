[project]
name = "personal-research-assistant"
version = "0.1.0"
description = "Local-first Personal Research Assistant API."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "boto3>=1.34.0",
    "aws-bedrock-token-generator>=1.1.0",
    "fastapi>=0.115.0",
    "langgraph>=1.0.0",
    "langsmith>=0.4.0",
    "mangum>=0.19.0",
    "opensearch-py>=2.7.0",
    "openai>=1.100.0",
    "psycopg[binary]>=3.2.0",
    "pydantic-settings>=2.6.0",
    "PyJWT[crypto]>=2.9.0",
    "python-multipart>=0.0.12",
    "ragas>=0.3.0,<1.0.0",
    "uvicorn[standard]>=0.30.0",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.27.0",
    "pytest>=8.3.0",
]

[build-system]
requires = ["setuptools>=69.0.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["apps/api/src", "platform/core/src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["apps/api/src", "platform/core/src"]
addopts = "-q"
